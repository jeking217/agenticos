# 部署到 unione 基础平台：Agent 集群不自带数据库与缓存，
# PG 走基础环境的 base-postgresql，Redis 走 base-redis。
#
#   docker compose --env-file .env.deploy -f docker-compose-deploy.yml up -d
#
# 与 docker-compose-prod.yml 的差别只有一处是结构性的：那个文件自带
# `db` / `redis` 两个服务，这个文件没有——它们已经在基础环境里跑着了，
# 再起一份就是两个实例抢同一份数据，而共用实例的前提是把连接参数指对。
#
# 集群只包含五个容器：
#
#   agent-migrate  跑 alembic 迁移后退出，app / worker / front 等它成功
#   agent-app      FastAPI / uvicorn
#   agent-worker   后台任务（ingestion、定时清理、触发的触发器）
#   agent-front    Next.js 控制台（BFF，服务端经集群网络找 agent-app）
#   agent-sandboxd 沙箱执行服务（服务名 sandboxd）。唯一持有宿主 docker.sock
#                  的容器，agent 要跑代码 / 出图 / 改文档 / computer use 时
#                  由它按会话起兄弟容器；agent-app 本身碰不到 socket。
#
# 前置条件（一次性）：
#   1. 共享 PG 里有一个自己的库，不要把表建进平台自己的 `unione` 库：
#        docker exec base-postgresql psql -U unione -d unione \
#          -c "CREATE DATABASE unione_agent OWNER unione;"
#      `unione` 是超级用户，`0143_pg_stat_statements` 那条迁移要 CREATE EXTENSION。
#   2. `.env.deploy` 里有 BASE_PG_PASSWORD、BASE_REDIS_PASSWORD、API_KEY 三个值
#      （模板见本文件末尾的注释）。生产模式下 Settings 会拒绝占位 API_KEY。
#   3. 镜像：默认用本机构建的 `local` 标签；部署到别的机器时把 AGENTICOS_VERSION
#      指向 registry 上的发布 tag，并先 `docker compose ... pull`。
name: unione-agent

# 日志封顶：json-file 不封顶的话一个忙的 API 能长到几百 MB，宿主机上没人替它轮转。
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

# 三个容器共用的连接与运行参数。放在这里而不是抄三遍，
# 是为了让「改一次，迁移/接口/后台任务一起改」成立。
x-agent-env: &agent-env
  ENVIRONMENT: ${APP_ENV:-production}
  DEBUG: "false"
  # --- 共享 PG（基础环境 base-postgresql）---
  POSTGRES_HOST: ${BASE_PG_HOST:-base-postgresql}
  POSTGRES_PORT: ${BASE_PG_PORT:-5432}
  POSTGRES_USER: ${BASE_PG_USER:-unione}
  POSTGRES_PASSWORD: ${BASE_PG_PASSWORD:?BASE_PG_PASSWORD is required}
  POSTGRES_DB: ${BASE_PG_DB:-unione_agent}
  # 共享实例的 max_connections 是 100，且平台自己的服务也在用。
  # 每个 API worker 会开两个池（会话池 + 向量库池），各占 POOL_SIZE + MAX_OVERFLOW，
  # 所以 2 worker × 2 × 8 = 32，加 worker 自身 16，总共不到 50，留得下余量。
  # 原来的 4 worker + 5/10 是 120，会直接把共享 PG 顶到 "too many clients"。
  DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
  # --- 共享 Redis（基础环境 base-redis）---
  REDIS_HOST: ${BASE_REDIS_HOST:-base-redis}
  REDIS_PORT: ${BASE_REDIS_PORT:-6379}
  REDIS_PASSWORD: ${BASE_REDIS_PASSWORD:?BASE_REDIS_PASSWORD is required}
  # 与平台服务隔离：同一个实例上按库号分区，键长得再像也撞不到一起。
  REDIS_DB: ${AGENT_REDIS_DB:-13}
  # 生产模式（ENVIRONMENT=production）下占位值会被 Settings 拒绝启动。
  API_KEY: ${API_KEY:?API_KEY is required}
  # 网关把这一套挂在某个路径段下时填这里（本机是 /agent）。接口会在
  # /api/v1 和 <前缀>/api/v1 两处同时应答：网关保留前缀或剥掉前缀都能工作，
  # 而容器之间（前端 BFF、worker）继续走不带前缀的那份。
  API_PATH_PREFIX: ${API_PATH_PREFIX:-}

services:
  # 跑完迁移就退出。app / worker 等它 completed_successfully，
  # 所以迁移失败时表现为「接口没起来」，原因在 `docker logs agent-migrate`。
  agent-migrate:
    logging: *logging
    container_name: agent-migrate
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-local}
    command: agenticos db upgrade
    env_file:
      - ./backend/.env
    # 显式 environment 覆盖 env_file 里的同项，这一步就是把 dev 的
    # localhost/postgres 换成基础环境里的实例。
    environment:
      <<: *agent-env
    networks:
      - unione-cloud
    restart: "no"

  agent-app:
    logging: *logging
    container_name: agent-app
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-local}
    stop_grace_period: 40s
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      <<: *agent-env
    # --ws websockets-sansio：uvicorn 的 auto 会挑旧实现，对 websockets>=14 握手失败，
    # 聊天的 WS 在部署环境里和本地一样需要它。
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-2}
      --timeout-worker-healthcheck ${UVICORN_WORKER_HEALTHCHECK_TIMEOUT:-60}
      --ws websockets-sansio
    ports:
      # 默认只绑回环，由宿主机上的网关/反向代理接入；
      # 端口可换是为了能和其他集群并存在一台机器上。
      - "${BIND_HOST:-127.0.0.1}:${APP_HOST_PORT:-8000}:8000"
    # 必须在基础网络里：POSTGRES_HOST / REDIS_HOST 填的是 base-postgresql、
    # base-redis 这类容器名，只有同网络的内嵌 DNS 才解析得到。
    networks:
      - unione-cloud
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  agent-front:
    logging: *logging
    container_name: agent-front
    image: ghcr.io/vstorm-co/agenticos-frontend:${AGENTICOS_VERSION:-local}
    environment:
      - NODE_ENV=production
      # 服务端渲染与 BFF 走集群网络里的容器名，不出宿主机。
      - BACKEND_URL=http://agent-app:8000
      # PUBLIC_* 是给**浏览器**用的地址，必须是对外可达的那一个，
      # 填容器名会得到「服务端正常、浏览器全错」的经典故障：
      # SSR 走集群网络能通，客户端每个请求都打到不存在的主机上。
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost:8000}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:3000}
      # 与后端同一个段：浏览器据此把 `<origin>/agent` 拼在 `/api/v1/...` 前面，
      # 得到 `/agent/api/v1/...`。留空即部署在根路径。
      - PUBLIC_API_PATH_PREFIX=${API_PATH_PREFIX:-}
      # basePath 在构建期就编进了路由与静态资源（`--build-arg
      # NEXT_PUBLIC_BASE_PATH=/agent`），这里再传一份是给服务端的
      # Route Handler 读：BFF 剥离路径、容器内健康检查都用它。
      - NEXT_PUBLIC_BASE_PATH=${FRONTEND_BASE_PATH:-}
      - ARTIFACT_ORIGIN=${ARTIFACT_ORIGIN:-}
      - CHAT_MAX_UPLOAD_SIZE_MB=${CHAT_MAX_UPLOAD_SIZE_MB:-10}
      # 基础环境里没有诊断采集端，默认关掉，免得每个页面都发没处收的埋点。
      - DIAGNOSTICS_ENABLED=${DIAGNOSTICS_ENABLED:-false}
      # Sign-in methods: empty means no third-party buttons at all. Unione is not
      # one of them - the backend's UNIONE_AUTH_ENABLED decides that form, and the
      # page asks for it at run time. Left unset, compose's default is `google`,
      # which draws a button nothing on a self-hosted box can complete.
      - OAUTH_PROVIDERS=${OAUTH_PROVIDERS:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONT_HOST_PORT:-3000}:3000"
    # 同 app：服务端要按容器名找到 agent-app。
    networks:
      - unione-cloud
    depends_on:
      agent-app:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
    healthcheck:
      # oven/bun 镜像里没有 curl/wget，用 bun 自带的 fetch 探。
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000${FRONTEND_BASE_PATH:-}/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  agent-worker:
    logging: *logging
    container_name: agent-worker
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-local}
    stop_grace_period: 45s
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      <<: *agent-env
      # 一个 ingest 子进程：它是 worker 内存里最大的一块，和下面的上限一起调。
      WORKER_INGEST_CHILDREN: ${WORKER_INGEST_CHILDREN:-1}
    command: python -m app.worker
    networks:
      - unione-cloud
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    # 每次心跳写进数据库后 touch 这个文件，探针只判断它是否在 90 秒内被动过。
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.stat(os.environ.get('WORKER_HEALTH_FILE', '/tmp/agenticos-worker-alive')).st_mtime > 90)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # 唯一持有 /var/run/docker.sock 的容器：agent-app 自己碰不到 socket，
  # 需要真跑代码、出图、改 docx/xlsx 或做 computer use 时，按会话请它起
  # 「兄弟」容器。整个沙箱的安全模型就建立在这个分工上。
  #
  # 服务名必须叫 sandboxd：后端探测「本机是否已有沙箱服务」用的地址是硬编码的
  # http://sandboxd:8080（app/services/sandbox_connection.py 的 LOCAL_SERVICE_URLS），
  # 换个名字只会在连接对话框里得到 url: null。
  sandboxd:
    logging: *logging
    container_name: agent-sandboxd
    # 必须与 backend/uv.lock 里 pydantic-ai-backend 的版本完全一致（当前 0.2.39）：
    # 客户端的路由和服务端配套发布，client 更新会调到服务端没有的接口；
    # backend/tests/test_sandboxd_compat.py 会卡住这种漂移。
    image: ghcr.io/vstorm-co/sandboxd:0.2.39
    # 没有 init 时服务是 PID 1，Python 只回收自己 wait 的子进程，
    # 剩下的孤儿会一直留着变僵尸（生产出过 600+）；容器里的 docker-init 负责回收。
    init: true
    env_file:
      # SANDBOXD_TOKEN 与 agent-app 读同一份文件，两边不会不一致。
      - ./backend/.env
    environment:
      SANDBOXD_HOST: 0.0.0.0
      SANDBOXD_PORT: "8080"
      # 宿主与容器必须**同路径**：服务先建目录，再让 daemon 把这个**宿主**路径
      # 挂给会话容器，daemon 是在宿主上解析路径的。命名卷、或只存在于本容器里
      # 的路径都会被拒（mounts denied）。
      #
      # 放 /tmp 是因为 Docker Desktop 的 WSL 虚拟机里 /tmp 天然两侧共享、
      # 且世界可写，uid 10001 不需要 chown；代价是重启后清空 —— 本地验证够用，
      # 正式机应换成有人备份的磁盘路径。该目录要先建好并放开权限，见文件末尾。
      SANDBOXD_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}
      # 允许 agent 申请的环境。**由 backend/app/core/catalog/sandbox_runtimes.json
      # 生成，不要手改这里**：`make sandbox-runtimes` 会重写这一段，连接对话框
      # 读的也是同一份目录，两边因此不会各说各话。不设的话会退回库自带的默认
      # allowlist，部署出去的能力就和界面显示的不是一回事了。
      SANDBOXD_RUNTIMES: '{"workbench":{"description":"Python, Node and LibreOffice - documents, data, charts and code","runtime":{"name":"workbench","base_image":"python:3.12-slim","description":"Python, Node and LibreOffice - documents, data, charts and code","setup_commands":["apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates ripgrep fd-find jq less procps xz-utils poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress unzip zip tzdata fonts-dejavu-core fonts-noto-cjk && ln -s /usr/bin/fdfind /usr/local/bin/fd && rm -rf /var/lib/apt/lists/*","arch=\"$$(dpkg --print-architecture)\"; case \"$$arch\" in amd64) node_arch=x64 ;; arm64) node_arch=arm64 ;; *) echo \"no Node build for $$arch\" >&2; exit 1 ;; esac; curl -fsSL \"https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-$${node_arch}.tar.xz\" | tar -xJ -C /usr/local --strip-components=1 --exclude CHANGELOG.md --exclude README.md --exclude LICENSE && npm install -g tsx @anthropic-ai/claude-code@2.1.288 @openai/codex@0.160.0 && npm cache clean --force","curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh"],"packages":["liteparse","pypdf","python-docx","openpyxl","python-pptx","pillow","pandas","duckdb","matplotlib","httpx","requests","beautifulsoup4","lxml","markdownify","pyyaml","tabulate","reportlab"],"env_vars":{"PYTHONUNBUFFERED":"1","PYTHONDONTWRITEBYTECODE":"1","PYTHONUTF8":"1","MPLBACKEND":"Agg","PIP_DISABLE_PIP_VERSION_CHECK":"1"}},"mem_limit":"2g","network_mode":"bridge"},"desktop":{"description":"A Linux desktop (XFCE and Firefox) for computer use, with Python and a shell","runtime":{"name":"desktop","base_image":"python:3.12-slim","description":"A Linux desktop (XFCE and Firefox) for computer use, with Python and a shell","setup_commands":["apt-get update && apt-get install -y --no-install-recommends xvfb x11-utils xfce4 xfce4-terminal dbus-x11 xdotool scrot firefox-esr fonts-dejavu-core fonts-noto-color-emoji git curl ca-certificates jq procps unzip && rm -rf /var/lib/apt/lists/*"],"packages":[],"env_vars":{"PYTHONUNBUFFERED":"1","PYTHONUTF8":"1","PIP_DISABLE_PIP_VERSION_CHECK":"1"}},"mem_limit":"2g","network_mode":"bridge"}}'
      # 会话容器以什么 uid 运行。必须等于服务自己的 uid —— 开会话时它要 chown
      # 工作区，非 root 的服务只能 chown 给自己，改别的数字会在第一个会话才失败。
      SANDBOXD_SANDBOX_UID: "10001"
      SANDBOXD_PERSIST_CONTAINERS: "true"
      # 停掉一天后的容器回收，工作区文件不动：装过的东西可以重建，
      # 文件是别人的活。没有它，宿主会被没人再附着的会话容器塞满。
      SANDBOXD_CONTAINER_TTL: "86400"
      SANDBOXD_MAX_SESSIONS_PER_TENANT: "10"
      SANDBOXD_NETWORK_MODE: none
      SANDBOXD_UI_ENABLED: "0"
    volumes:
      # 整份 compose 里唯一交出 socket 的地方。
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}:${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}
    group_add:
      # Docker Desktop 的 socket 是 root:root(gid 0)；换到原生 Linux 宿主时
      # 传宿主 docker 组的 gid（`stat -c %g /var/run/docker.sock`）。
      - "${DOCKER_GID:-0}"
    networks:
      # 只加集群内部网络。一个能在这台机器上起容器的服务，不该出现在
      # 任何对外可路由的网络上。
      - unione-cloud
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 冷启动要先按下面的 runtimes 预热镜像（apt + node + LibreOffice），慢。
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

networks:
  # 基础平台的网络，由 unione-cloud 那套 compose 创建，这里只加入、不创建。
  unione-cloud:
    name: ${UNIONE_NETWORK:-unione-cloud_net}
    external: true

volumes:
  # app 与 worker 共享的上传目录（compose 会自动加 unione-agent_ 前缀）。
  media_data:

# .env.deploy 模板（放在仓库根，已进 .git/info/exclude）：
#
#   AGENTICOS_VERSION=subpath
#   APP_ENV=production
#   BASE_PG_PASSWORD=<base-postgresql 的 POSTGRES_PASSWORD>
#   BASE_REDIS_PASSWORD=<base-redis 的 --requirepass 值>
#   API_KEY=<openssl rand -hex 32>
#   APP_HOST_PORT=8010
#   FRONT_HOST_PORT=3010
#
#   # 前端挂在 <host>/agent，后端在 <host>/agent/api：
#   API_PATH_PREFIX=/agent
#   FRONTEND_BASE_PATH=/agent
#   PUBLIC_API_URL=https://online.unione.cloud
#   PUBLIC_WS_URL=wss://online.unione.cloud
#   PUBLIC_SITE_URL=https://online.unione.cloud/agent
#
# 三个 PUBLIC_* 是**浏览器**用的地址，必须是对外可达的那一条：填容器名，
# 会得到「SSR 正常、浏览器全错」。
#
# PUBLIC_API_URL / PUBLIC_WS_URL 只写**源**，不写路径 —— `/agent/api` 那段
# 由上面的 API_PATH_PREFIX 拼上去（前端自己拼）。写进 URL 里就成了
# `<源>/agent/api` + `/agent` = `/agent/api/agent/api/v1/...`，CSP 和每个
# 请求都会带着这个双前缀。只有 PUBLIC_SITE_URL 是完整的站点地址，
# 因为它就是页面自己的地址，没有第二个变量替它补前缀。
#
# --- 网关怎么转 ---
#
# 前端必须**原样转发，不要 strip**：basePath 已经编进页面里的每个链接和
# `_next/static` 的每个资源路径，剥掉之后浏览器按带前缀的地址去取，
# 网关却按没有前缀的路径找，整站白屏。
#
#   location /agent/ { proxy_pass http://agent-front:3000/agent/; }
#
# 但前端与后端现在**共用 `/agent` 这一层**：前端的页面和 BFF 在 `/agent/*`
# （BFF 即 `/agent/api/*`），后端在 `/agent/api/v1/*`，两者只差 `v1` 一段。
# 所以网关必须把更长的后端前缀单独摘出来，否则浏览器的 BFF 请求会被送进
# 后端，变成 `/api/v1/api/v1/...` 这样的双前缀：
#
#   location ^~ /agent/api/v1/ { proxy_pass http://agent-app:8000/agent/api/v1/; }
#   location /agent/           { proxy_pass http://agent-front:3000/agent/; }
#
# 后端两种都行 —— 它在 `<前缀>/api/v1` 和 `/api/v1` 上都应答，上面这条是
# 保留前缀的写法；换成 `proxy_pass http://agent-app:8000/api/v1/;` 亦可。
#
# 聊天走 WebSocket，网关要放行升级头，否则对话只发不收：
#
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade $http_upgrade;
#   proxy_set_header Connection "upgrade";
#
# 前端镜像必须用同一个前缀构建一次（basePath 是构建期的，运行时改不了）：
#
#   docker build -f frontend/Dockerfile \
#     --build-arg NEXT_PUBLIC_BASE_PATH=/agent \
#     -t ghcr.io/vstorm-co/agenticos-frontend:subpath frontend
#
# 下面两个有默认值，一般不用写：
#   SANDBOX_WORKSPACE_ROOT=/tmp/agenticos-sandbox-workspaces
#   DOCKER_GID=0            # 原生 Linux 宿主用 `stat -c %g /var/run/docker.sock`
#
# 首次启动前必须先建好沙箱工作区并放开权限（uid 10001 要能写）。
# Docker Desktop 上宿主就是 WSL 虚拟机，所以用容器来建，别用 Windows 的资源管理器：
#
#   docker run --rm -v /tmp/agenticos-sandbox-workspaces:/w \
#     alpine sh -c "chmod 777 /w"
#
# 目录必须两侧同路径，且沙箱服务与 daemon 看到的是同一个 —— 命名卷和
# 只在容器内存在的路径都会被 daemon 拒绝（mounts denied）。
# /tmp 在 Docker Desktop 里天然共享但重启即清空，适合本地验证；
# 正式机器把 SANDBOX_WORKSPACE_ROOT 换成有备份的磁盘路径。
